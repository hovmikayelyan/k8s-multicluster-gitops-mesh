apiVersion: v1
kind: ServiceAccount
metadata: {name: podinfo}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  labels: {app: podinfo}
spec:
  selector: {app: podinfo}
  ports: [{name: http, port: 9898, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: podinfo}
spec:
  minAvailable: 1
  selector: {matchLabels: {app: podinfo}}
